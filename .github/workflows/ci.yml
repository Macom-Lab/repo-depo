name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  trivy-repository:
    name: Trivy repository scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate repository vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: .git,.venv,.pytest_cache,.cache,.trivy-temp,notify/node_modules,reports
          format: json
          output: reports/sca.trivy.json
          exit-code: "0"
          version: v0.74.0

      - name: Upload repository vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: sca.trivy
          path: reports/sca.trivy.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce repository vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .git,.venv,.pytest_cache,.cache,.trivy-temp,notify/node_modules,reports
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true

  trivy-container:
    name: Trivy container scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag vulntracker:${{ github.sha }} .

      - name: Generate container vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: vulntracker:${{ github.sha }}
          scanners: vuln,misconfig
          format: json
          output: reports/container.trivy.json
          exit-code: "0"
          version: v0.74.0

      - name: Upload container vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: container.trivy
          path: reports/container.trivy.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce container vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: vulntracker:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true
