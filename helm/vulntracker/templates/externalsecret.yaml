apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "vulntracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "vulntracker.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          {{- include "vulntracker.labels" . | nindent 10 }}
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: {{ required "externalSecret.remoteRef.key is required" .Values.externalSecret.remoteRef.key | quote }}
        property: {{ required "externalSecret.remoteRef.secretKeyProperty is required" .Values.externalSecret.remoteRef.secretKeyProperty | quote }}
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ required "externalSecret.remoteRef.key is required" .Values.externalSecret.remoteRef.key | quote }}
        property: {{ required "externalSecret.remoteRef.databaseUrlProperty is required" .Values.externalSecret.remoteRef.databaseUrlProperty | quote }}
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: NOTIFY_SERVICE_KEY
      remoteRef:
        key: {{ required "externalSecret.remoteRef.key is required" .Values.externalSecret.remoteRef.key | quote }}
        property: {{ required "externalSecret.remoteRef.notifyServiceKeyProperty is required" .Values.externalSecret.remoteRef.notifyServiceKeyProperty | quote }}
        conversionStrategy: Default
        decodingStrategy: None
